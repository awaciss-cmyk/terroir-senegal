<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terroir Sénégal - Panel Admin</title>
    <style>
        :root {
            --primary: #e67e22;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --danger: #e74c3c;
            --success: #2ecc71;
            --grey: #bdc3c7;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            color: var(--dark);
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .btn-logout {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--grey);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button.btn-submit {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
        }
        button.btn-submit:hover { background-color: #d35400; }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .product-card h4 { margin: 5px 0; font-size: 16px; }
        .product-card .price { color: var(--primary); font-weight: bold; margin-bottom: 5px; }
        .product-card .stock { font-size: 12px; color: #7f8c8d; margin-bottom: 10px; }
        .btn-delete {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- VOTRE MIDDLEWARE DE SÉCURITÉ REPRIS -->
<script>
  const user = JSON.parse(localStorage.getItem('user'));

  if (!user || user.role !== 'admin') {
    window.location.href = "login.html";
  }
</script>

<div class="container">
    <header>
        <div>
            <h1 style="margin:0;">🌿 Gestion du Terroir Sénégal</h1>
            <p style="margin:5px 0 0 0; color: var(--success); font-weight: bold;">Espace d'Administration</p>
        </div>
        <button class="btn-logout" onclick="logout()">Se déconnecter</button>
    </header>

    <div class="admin-grid">
        <!-- FORMULAIRE -->
        <div class="card">
            <h2>Nouveau Produit</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Nom du produit</label>
                    <input type="text" id="prod-nom" placeholder="Ex: Bissap, Café Touba..." required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="prod-cat">
                        <option value="Légumes">Légumes</option>
                        <option value="Fruits">Fruits</option>
                        <option value="Épices">Épices</option>
                        <option value="Confitures">Confitures</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Prix (FCFA)</label>
                    <input type="number" id="prod-prix" placeholder="Ex: 500" required>
                </div>
                <div class="form-group">
                    <label>Stock de départ</label>
                    <input type="number" id="prod-stock" placeholder="Ex: 50" required>
                </div>
                <div class="form-group">
                    <label>Image du produit</label>
                    <input type="file" id="prod-image" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Mettre en ligne</button>
            </form>
        </div>

        <!-- LISTE ET SUPPRESSION -->
        <div class="card">
            <h2>Catalogue Actuel</h2>
            <div class="products-grid" id="productsContainer">
                <p>Chargement des produits de la base...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // URL relative qui s'adapte automatiquement sur Render ou en local
    const API_URL = "/api/produits"; 

    document.addEventListener("DOMContentLoaded", fetchProducts);

    // ACTION : Charger le catalogue
    async function fetchProducts() {
        const container = document.getElementById("productsContainer");
        try {
            const response = await fetch(API_URL);
            const products = await response.json();

            if (!products || products.length === 0) {
                container.innerHTML = "<p>Aucun produit en stock.</p>";
                return;
            }

            container.innerHTML = "";
            products.forEach(p => {
                // Utilisation de p.img qui matche avec vos graines (seed)
                container.innerHTML += `
                    <div class="product-card" id="product-${p._id}">
                        <div>
                            <img src="${p.img}" alt="${p.nom}">
                            <h4>${p.nom}</h4>
                            <div class="price">${p.prix} FCFA</div>
                            <div class="stock">Stock : ${p.stock}</div>
                        </div>
                        <button class="btn-delete" onclick="deleteProduct('${p._id}')">Supprimer</button>
                    </div>
                `;
            });
        } catch (error) {
            container.innerHTML = "<p style='color:red;'>Erreur lors du chargement des produits.</p>";
        }
    }

    // ACTION : Envoyer le nouveau produit
    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.innerText = "Téléversement...";
        submitBtn.disabled = true;

        const formData = new FormData();
        formData.append("nom", document.getElementById("prod-nom").value);
        formData.append("cat", document.getElementById("prod-cat").value);
        formData.append("prix", document.getElementById("prod-prix").value);
        formData.append("stock", document.getElementById("prod-stock").value);
        formData.append("image", document.getElementById("prod-image").files[0]);

        try {
            const response = await fetch(`${API_URL}/ajouter`, { method: "POST", body: formData });
            const data = await response.json();

            if (response.ok) {
                alert("Produit ajouté !");
                document.getElementById("addProductForm").reset();
                fetchProducts();
            } else {
                alert("Erreur : " + data.message);
            }
        } catch (error) {
            alert("Erreur réseau serveur.");
        } finally {
            submitBtn.innerText = "Mettre en ligne";
            submitBtn.disabled = false;
        }
    });

    // ACTION : Supprimer
    async function deleteProduct(id) {
        if (confirm("Voulez-vous supprimer ce produit ?")) {
            try {
                const response = await fetch(`${API_URL}/supprimer/${id}`, { method: "DELETE" });
                if (response.ok) {
                    document.getElementById(`product-${id}`).remove();
                } else {
                    alert("Erreur lors de la suppression.");
                }
            } catch (error) {
                alert("Erreur réseau.");
            }
        }
    }

    function logout() {
        localStorage.removeItem('user');
        window.location.href = "login.html";
    }
</script>
</body>
</html>
