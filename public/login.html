<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – Terroir Sénégal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e67e22, #2c3e50);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 40px 35px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 380px;
    }
    .logo { text-align: center; margin-bottom: 25px; }
    .logo h1 { font-size: 22px; color: #2c3e50; }
    .logo p  { color: #7f8c8d; font-size: 13px; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #2c3e50; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px;
      border: 1px solid #ddd; border-radius: 6px;
      font-size: 15px; outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #e67e22; }
    button {
      width: 100%; padding: 13px;
      background: #e67e22; color: white;
      border: none; border-radius: 6px;
      font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #d35400; }
    button:disabled { background: #bdc3c7; cursor: not-allowed; }
    #msg { margin-top: 15px; text-align: center; font-size: 14px; color: #e74c3c; }
    .back { text-align: center; margin-top: 15px; }
    .back a { color: #e67e22; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🌿 Terroir Sénégal</h1>
    <p>Connexion à votre espace</p>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="votre@email.com">
  </div>
  <div class="form-group">
    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button id="btn" onclick="login()">Se connecter</button>
  <p id="msg"></p>
  <div class="back"><a href="/index.html">← Retour à la boutique</a></div>
</div>
